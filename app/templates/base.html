<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Marktplaats Monitor{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --mp-orange: #ff6200;
      --mp-orange-dark: #d94f00;
    }
    body { background: #f4f5f7; font-family: 'Segoe UI', sans-serif; }

    .navbar { background: var(--mp-orange) !important; }
    .navbar-brand { font-weight: 700; font-size: 1.2rem; }
    .navbar .nav-link { color: rgba(255,255,255,.85) !important; }
    .navbar .nav-link:hover,
    .navbar .nav-link.active { color: #fff !important; }

    .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .stat-card .stat-icon { font-size: 2rem; opacity: .7; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; }

    .item-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      transition: transform .15s, box-shadow .15s;
      overflow: hidden;
    }
    .item-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
    .item-card .item-thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #e9ecef;
    }
    .item-card .item-thumb-placeholder {
      height: 160px;
      background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #adb5bd;
      font-size: 2.5rem;
    }
    .item-price { font-size: 1.1rem; font-weight: 700; color: var(--mp-orange); }
    .badge-search { background: var(--mp-orange); font-size: .7rem; }

    .log-box {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: .8rem;
      height: 240px;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .log-INFO  { color: #a6e3a1; }
    .log-ERROR { color: #f38ba8; }
    .log-WARNING { color: #fab387; }
    .log-DEBUG { color: #89b4fa; }

    .table thead th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }

    .btn-mp { background: var(--mp-orange); border-color: var(--mp-orange); color: #fff; }
    .btn-mp:hover { background: var(--mp-orange-dark); border-color: var(--mp-orange-dark); color: #fff; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand text-white" href="/">
      <i class="bi bi-bell-fill me-2"></i>Marktplaats Monitor
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
            <i class="bi bi-house me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'searches' %}active{% endif %}" href="/searches">
            <i class="bi bi-search me-1"></i>Zoekopdrachten
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">
            <i class="bi bi-gear me-1"></i>Instellingen
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
