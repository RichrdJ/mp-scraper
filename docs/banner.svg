<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#131729"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a72d6"/>
      <stop offset="60%" stop-color="#6ea3f5"/>
      <stop offset="100%" stop-color="#3a72d6"/>
    </linearGradient>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6ea3f5"/>
      <stop offset="100%" stop-color="#3a72d6"/>
    </linearGradient>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Decorative glow circles -->
  <circle cx="1100" cy="140" r="260" fill="#3a72d6" fill-opacity="0.07"/>
  <circle cx="1200" cy="0"   r="140" fill="#6ea3f5" fill-opacity="0.06"/>
  <circle cx="60"   cy="260" r="180" fill="#3a72d6" fill-opacity="0.05"/>
  <circle cx="900"  cy="280" r="100" fill="#3a72d6" fill-opacity="0.04"/>

  <!-- Subtle grid dots (right side decoration) -->
  <g fill="#3a72d6" fill-opacity="0.12">
    <circle cx="820" cy="60"  r="2"/><circle cx="860" cy="60"  r="2"/><circle cx="900" cy="60"  r="2"/><circle cx="940" cy="60"  r="2"/><circle cx="980" cy="60"  r="2"/>
    <circle cx="820" cy="100" r="2"/><circle cx="860" cy="100" r="2"/><circle cx="900" cy="100" r="2"/><circle cx="940" cy="100" r="2"/><circle cx="980" cy="100" r="2"/>
    <circle cx="820" cy="140" r="2"/><circle cx="860" cy="140" r="2"/><circle cx="900" cy="140" r="2"/><circle cx="940" cy="140" r="2"/><circle cx="980" cy="140" r="2"/>
    <circle cx="820" cy="180" r="2"/><circle cx="860" cy="180" r="2"/><circle cx="900" cy="180" r="2"/><circle cx="940" cy="180" r="2"/><circle cx="980" cy="180" r="2"/>
    <circle cx="820" cy="220" r="2"/><circle cx="860" cy="220" r="2"/><circle cx="900" cy="220" r="2"/><circle cx="940" cy="220" r="2"/><circle cx="980" cy="220" r="2"/>
  </g>

  <!-- Mock notification cards (right side) -->
  <!-- Card 1 -->
  <rect x="1010" y="48" width="168" height="58" rx="10" fill="#1c2240" fill-opacity="0.9"/>
  <rect x="1010" y="48" width="4"   height="58" rx="2"  fill="#3a72d6"/>
  <rect x="1022" y="60" width="60" height="8" rx="4" fill="#3a72d6" fill-opacity="0.6"/>
  <rect x="1022" y="74" width="100" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="1022" y="86" width="76"  height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
  <text x="1158" y="66" font-family="sans-serif" font-size="11" fill="#6ea3f5" font-weight="600" text-anchor="end">€ 49,00</text>

  <!-- Card 2 -->
  <rect x="1010" y="118" width="168" height="58" rx="10" fill="#1c2240" fill-opacity="0.9"/>
  <rect x="1010" y="118" width="4"   height="58" rx="2"  fill="#6ea3f5"/>
  <rect x="1022" y="130" width="80" height="8" rx="4" fill="#6ea3f5" fill-opacity="0.5"/>
  <rect x="1022" y="144" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="1022" y="156" width="65"  height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
  <text x="1158" y="136" font-family="sans-serif" font-size="11" fill="#6ea3f5" font-weight="600" text-anchor="end">€ 125,00</text>

  <!-- Card 3 -->
  <rect x="1010" y="188" width="168" height="58" rx="10" fill="#1c2240" fill-opacity="0.9"/>
  <rect x="1010" y="188" width="4"   height="58" rx="2"  fill="#3a72d6"/>
  <rect x="1022" y="200" width="55" height="8" rx="4" fill="#3a72d6" fill-opacity="0.6"/>
  <rect x="1022" y="214" width="95"  height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="1022" y="226" width="70"  height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
  <text x="1158" y="206" font-family="sans-serif" font-size="11" fill="#6ea3f5" font-weight="600" text-anchor="end">€ 12,50</text>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Bell icon (Bootstrap bi-bell-fill, 16px source → scale 7 → 112px, centered at x=118,y=128) -->
  <g transform="translate(118,128) scale(7) translate(-8,-8)" fill="url(#bellGrad)" filter="url(#softglow)">
    <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm.995-14.901a1 1 0 1 0-1.99 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901z"/>
  </g>

  <!-- Notification dot on bell -->
  <circle cx="150" cy="76" r="11" fill="#f38ba8"/>
  <text x="150" y="81" font-family="sans-serif" font-size="12" font-weight="800" fill="white" text-anchor="middle">!</text>

  <!-- App title -->
  <text x="228" y="138"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="60" font-weight="800" fill="white" letter-spacing="-2">
    Marktplaats Monitor
  </text>

  <!-- Tagline -->
  <text x="230" y="176"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="21" fill="#7a90c0" letter-spacing="0.2">
    Nooit meer een koopje missen
  </text>

  <!-- Pills -->
  <rect x="230" y="205" width="96"  height="26" rx="13" fill="#3a72d6" fill-opacity="0.2" stroke="#3a72d6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="278" y="223" font-family="'Segoe UI',sans-serif" font-size="12" fill="#7eb3ff" text-anchor="middle" font-weight="600">Python 3.12</text>

  <rect x="334" y="205" width="68"  height="26" rx="13" fill="#3a72d6" fill-opacity="0.2" stroke="#3a72d6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="368" y="223" font-family="'Segoe UI',sans-serif" font-size="12" fill="#7eb3ff" text-anchor="middle" font-weight="600">Flask</text>

  <rect x="410" y="205" width="74"  height="26" rx="13" fill="#3a72d6" fill-opacity="0.2" stroke="#3a72d6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="447" y="223" font-family="'Segoe UI',sans-serif" font-size="12" fill="#7eb3ff" text-anchor="middle" font-weight="600">Docker</text>

  <rect x="492" y="205" width="74"  height="26" rx="13" fill="#3a72d6" fill-opacity="0.2" stroke="#3a72d6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="529" y="223" font-family="'Segoe UI',sans-serif" font-size="12" fill="#7eb3ff" text-anchor="middle" font-weight="600">SQLite</text>

  <rect x="574" y="205" width="100" height="26" rx="13" fill="#3a72d6" fill-opacity="0.2" stroke="#3a72d6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="624" y="223" font-family="'Segoe UI',sans-serif" font-size="12" fill="#7eb3ff" text-anchor="middle" font-weight="600">Dark mode</text>
</svg>
